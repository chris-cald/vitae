services:
  backend:
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_MODELS: "llama3 nomic-embed-text"
    restart: unless-stopped

volumes:
  ollama_data:
