services:
  backend:
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/vitae
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: vitae-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vitae
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
