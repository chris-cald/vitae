services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: vitae-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      # To use PostgreSQL, override DATABASE_URL in your .env or compose file:
      # DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/vitae
      # External LiteLLM API base URL (override in litellm override)
      LITELLM_API_BASE: "https://api.litellm.example.com"
      # External LiteLLM API key (override in litellm override)
      LITELLM_API_KEY: "your-litellm-api-key"
    restart: unless-stopped
    volumes:
      - .:/app
    # No external dependencies for dev (sqlite)