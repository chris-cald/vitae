services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      UPLOAD_DIR: .ignore/uploads
      # To use PostgreSQL, override DATABASE_URL in your .env or compose file:
      # DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/vitae
      # External LiteLLM API base URL. Uncomment and set to use external LiteLLM service.
      # LITELLM_API_BASE: "https://api.litellm.example.com"
      # LITELLM_API_KEY: "your-litellm-api-key"
    restart: unless-stopped
    volumes:
      - .:/app
    networks:
      - backend-net

networks:
  backend-net:
    external: false
