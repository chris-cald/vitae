version: '3.8'
services:
  backend:
    build: .
    container_name: vitae-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      # To use PostgreSQL, override DATABASE_URL in your .env or compose file:
      # DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/vitae
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      - postgres
    # Uncomment below if you want to use a .env file
    # env_file:
    #   - .env

  postgres:
    image: postgres:15
    container_name: vitae-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vitae
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
