name: Validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.26
          python-version: "3.12"
          enable-cache: true
      - run: npm run setup
      - run: npm run check
      - run: npm run test:release
      - run: npm run test:schema
      - run: npm run test:career-core
